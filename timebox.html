<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TimeBox · 时间盒子</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, 'Noto Sans SC', system-ui, sans-serif;
    background: transparent;
    color: #e8e4de;
    user-select: none;
    -webkit-app-region: drag;
  }
  .app {
    max-width: 340px; margin: 0 auto;
    background: rgba(18,18,22,0.88);
    backdrop-filter: blur(24px);
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.06);
    padding: 20px 20px 12px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  }

  /* header */
  .hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; -webkit-app-region: no-drag; }
  .hdr .date { font-size: 11px; color: rgba(255,255,255,0.35); letter-spacing: 1px; }
  .hdr .slot-num { font-size: 11px; color: rgba(255,255,255,0.3); }

  /* timer */
  .timer-wrap { text-align: center; margin-bottom: 8px; }
  .timer {
    font-size: 64px; font-weight: 200; letter-spacing: 2px;
    font-variant-numeric: tabular-nums;
    color: #d4b88c;
    line-height: 1;
  }
  .timer.warning { color: #e88060; }
  .timer-block {
    font-size: 12px; color: rgba(255,255,255,0.3); margin-top: 2px;
    letter-spacing: 0.5px;
  }

  /* progress */
  .progress { height: 3px; background: rgba(255,255,255,0.06); border-radius: 2px; margin-bottom: 16px; overflow: hidden; }
  .progress .fill { height: 100%; background: #d4b88c; border-radius: 2px; transition: width 1s linear; }
  .progress .fill.warning { background: #e88060; }

  /* input */
  .focus-box { margin-bottom: 12px; -webkit-app-region: no-drag; }
  .focus-box label { font-size: 10px; color: rgba(255,255,255,0.2); letter-spacing: 2px; display: block; margin-bottom: 4px; }
  .focus-box .row { display: flex; gap: 6px; }
  .focus-box input {
    flex: 1; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.06);
    border-radius: 8px; padding: 8px 12px; color: #e8e4de; font-size: 13px;
    outline: none; font-family: inherit; transition: .2s;
    -webkit-app-region: no-drag;
  }
  .focus-box input:focus { border-color: rgba(212,184,140,0.4); background: rgba(255,255,255,0.08); }
  .focus-box input::placeholder { color: rgba(255,255,255,0.2); }
  .focus-box button {
    background: rgba(212,184,140,0.15); border: 1px solid rgba(212,184,140,0.2);
    border-radius: 8px; color: #d4b88c; padding: 8px 14px; cursor: pointer;
    font-size: 12px; transition: .2s; font-family: inherit;
    -webkit-app-region: no-drag;
  }
  .focus-box button:hover { background: rgba(212,184,140,0.25); }
  .focus-box button.punched { background: rgba(130,200,150,0.2); border-color: rgba(130,200,150,0.3); color: #82c896; }

  /* intention display */
  .intention {
    text-align: center; font-size: 14px; font-weight: 500;
    color: rgba(255,255,255,0.5); margin-bottom: 14px;
    min-height: 20px;
  }
  .intention.active { color: #d4b88c; }

  /* log */
  .log { margin-top: 8px; }
  .log-toggle {
    background: none; border: none; color: rgba(255,255,255,0.2); font-size: 11px;
    cursor: pointer; font-family: inherit; padding: 4px 0; width: 100%; text-align: left;
    -webkit-app-region: no-drag;
  }
  .log-toggle:hover { color: rgba(255,255,255,0.4); }
  .log-list { max-height: 0; overflow: hidden; transition: max-height .3s; }
  .log-list.open { max-height: 300px; overflow-y: auto; }
  .log-list .entry {
    padding: 6px 8px; border-bottom: 1px solid rgba(255,255,255,0.04);
    font-size: 12px; display: flex; justify-content: space-between; gap: 6px;
  }
  .log-list .entry .task { color: rgba(255,255,255,0.5); }
  .log-list .entry .meta { color: rgba(255,255,255,0.2); font-size: 10px; white-space: nowrap; }

  /* controls */
  .controls { display: flex; gap: 6px; margin-top: 12px; -webkit-app-region: no-drag; }
  .controls button {
    flex: 1; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
    border-radius: 8px; padding: 8px; color: rgba(255,255,255,0.4); cursor: pointer;
    font-size: 11px; transition: .2s; font-family: inherit;
    -webkit-app-region: no-drag;
  }
  .controls button:hover { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6); }
  .controls button.primary { background: rgba(212,184,140,0.12); color: #d4b88c; border-color: rgba(212,184,140,0.15); }
  .controls button.primary:hover { background: rgba(212,184,140,0.2); }

  .empty-log { text-align: center; padding: 20px; color: rgba(255,255,255,0.15); font-size: 12px; }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="hdr">
    <span class="date" id="dateDisplay"></span>
    <span class="slot-num" id="slotNum"></span>
  </div>

  <div class="timer-wrap">
    <div class="timer" id="timerDisplay">9:59</div>
    <div class="timer-block" id="blockDisplay">00:00 – 00:10 · 第 1 块</div>
  </div>

  <div class="progress"><div class="fill" id="progressFill"></div></div>

  <div class="intention" id="intentionDisplay">✏️ 写下去做什么</div>

  <div class="focus-box">
    <label>🎯 这个10分钟</label>
    <div class="row">
      <input id="taskInput" placeholder="要做什么？" onkeydown="if(event.key==='Enter') punchIn()">
      <button id="punchBtn" onclick="punchIn()">✅ 打卡</button>
    </div>
  </div>

  <div class="controls">
    <button class="primary" id="btnToggle" onclick="toggleTimer()">⏸ 暂停</button>
    <button onclick="skipBlock()">⏭ 跳过</button>
    <button onclick="resetAll()">⟳ 重置</button>
  </div>

  <div class="log">
    <button class="log-toggle" onclick="toggleLog()">📋 今天记录 ▾</button>
    <div class="log-list" id="logList"><div class="empty-log">还没有打卡记录</div></div>
  </div>
</div>

<script>
// ─── STATE ───────────────────────────────────────────────
var state = {
    running: true,
    remaining: 599,  // 9:59 in seconds
    total: 600,
    blockIdx: 0,
    round: 0,
    task: '',
    intention: '',
    interval: null,
    dayKey: todayKey(),
};

function todayKey() { var d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }

// ─── INIT ────────────────────────────────────────────────
function init() {
    var saved = JSON.parse(localStorage.getItem('timebox_state'));
    if (saved) {
        if (saved.dayKey === todayKey()) {
            state.running = saved.running;
            state.remaining = saved.remaining;
            state.round = saved.round || 0;
            state.task = saved.task || '';
            if (state.task) document.getElementById('taskInput').value = state.task;
        }
        state.blockIdx = saved.blockIdx || currentBlock();
    } else {
        state.blockIdx = currentBlock();
    }
    updateClock();
    renderLog();
    state.interval = setInterval(tick, 1000);
}

function currentBlock() {
    var d = new Date();
    return Math.floor((d.getHours()*60 + d.getMinutes()) / 10);
}

// ─── TICK ─────────────────────────────────────────────────
function tick() {
    if (!state.running) return;
    state.remaining--;
    if (state.remaining <= 0) {
        state.remaining = 0;
        autoPunch();
        nextBlock();
    }
    updateClock();
}

function updateClock() {
    var m = Math.floor(state.remaining / 60);
    var s = state.remaining % 60;
    var el = document.getElementById('timerDisplay');
    el.textContent = m + ':' + (s<10?'0':'') + s;
    el.classList.toggle('warning', state.remaining < 120);

    var pct = ((state.total - state.remaining) / state.total) * 100;
    var fill = document.getElementById('progressFill');
    fill.style.width = Math.min(pct, 100) + '%';
    fill.classList.toggle('warning', state.remaining < 120);

    var block = state.blockIdx;
    document.getElementById('blockDisplay').textContent =
        slotStr(block) + ' · 第 ' + (block+1) + ' 块';
    document.getElementById('slotNum').textContent = state.round + ' 轮打卡';

    var d = new Date();
    var weekdays = ['日','一','二','三','四','五','六'];
    document.getElementById('dateDisplay').textContent =
        d.getFullYear() + '.' + (d.getMonth()+1) + '.' + d.getDate() + ' 周' + weekdays[d.getDay()];
}

function slotStr(idx) {
    var h1 = Math.floor(idx*10/60), m1 = idx*10%60;
    var h2 = Math.floor((idx+1)*10/60)%24, m2 = (idx+1)*10%60;
    return (h1<10?'0':'')+h1+':'+(m1<10?'0':'')+m1+' – '+(h2<10?'0':'')+h2+':'+(m2<10?'0':'')+m2;
}

// ─── TIMER CONTROLS ──────────────────────────────────────
function toggleTimer() {
    state.running = !state.running;
    document.getElementById('btnToggle').textContent = state.running ? '⏸ 暂停' : '▶ 继续';
    saveState();
}

function nextBlock() {
    state.blockIdx = (state.blockIdx + 1) % (24*6);
    state.total = 600;
    state.remaining = 600;
    state.running = true;
    document.getElementById('btnToggle').textContent = '⏸ 暂停';
    saveState();
}

function skipBlock() {
    autoPunch();
    nextBlock();
}

function resetAll() {
    state.blockIdx = currentBlock();
    state.total = 600;
    state.remaining = 600;
    state.running = true;
    state.round = 0;
    state.task = '';
    document.getElementById('taskInput').value = '';
    document.getElementById('intentionDisplay').textContent = '✏️ 写下去做什么';
    document.getElementById('intentionDisplay').className = 'intention';
    document.getElementById('btnToggle').textContent = '⏸ 暂停';
    localStorage.removeItem('timebox_log_' + todayKey());
    renderLog();
    saveState();
}

// ─── PUNCH ────────────────────────────────────────────────
function punchIn() {
    var task = document.getElementById('taskInput').value.trim();
    if (!task) task = '（专注）';
    state.task = task;
    state.round++;

    // Save to log
    var logs = getLogs();
    var now = new Date();
    var t = (now.getHours()<10?'0':'')+now.getHours()+':'+(now.getMinutes()<10?'0':'')+now.getMinutes();
    var entry = {
        task: task,
        time: t,
        block: state.blockIdx,
        slot: slotStr(state.blockIdx),
        duration: '10min',
        ts: Date.now()
    };
    logs.unshift(entry);
    localStorage.setItem('timebox_log_' + todayKey(), JSON.stringify(logs));
    renderLog();

    // Sync to daily note (fire-and-forget — fail silently if server not running)
    fetch('http://localhost:8765/api/punch', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ time: t, task: task, slot: entry.slot })
    }).catch(function() {});

    // Show intention
    document.getElementById('intentionDisplay').textContent = '🎯 ' + task;
    document.getElementById('intentionDisplay').className = 'intention active';

    // Flash button
    var btn = document.getElementById('punchBtn');
    btn.textContent = '✅ 已打卡';
    btn.classList.add('punched');
    setTimeout(function() { btn.textContent='✅ 打卡'; btn.classList.remove('punched'); }, 1500);

    // ✅ Restart 10-min timer — new task, fresh block
    state.total = 600;
    state.remaining = 600;
    state.running = true;
    document.getElementById('btnToggle').textContent = '⏸ 暂停';

    saveState();
}

function autoPunch() {
    var task = document.getElementById('taskInput').value.trim();
    if (!task) return;
    state.task = task;
    state.round++;

    var logs = getLogs();
    var now = new Date();
    var t = (now.getHours()<10?'0':'')+now.getHours()+':'+(now.getMinutes()<10?'0':'')+now.getMinutes();
    logs.unshift({ task: task, time: t, block: state.blockIdx, slot: slotStr(state.blockIdx), duration: '10min', ts: Date.now() });
    localStorage.setItem('timebox_log_' + todayKey(), JSON.stringify(logs));
    renderLog();
}

// ─── LOG ──────────────────────────────────────────────────
function getLogs() {
    try { return JSON.parse(localStorage.getItem('timebox_log_' + todayKey())) || []; }
    catch(e) { return []; }
}

function renderLog() {
    var logs = getLogs();
    var el = document.getElementById('logList');
    if (!logs.length) {
        el.innerHTML = '<div class="empty-log">还没有打卡记录</div>';
        return;
    }
    el.innerHTML = logs.slice(0, 30).map(function(e) {
        return '<div class="entry"><span class="task">🎯 ' + e.task + '</span><span class="meta">' + e.slot + ' · ' + e.time + '</span></div>';
    }).join('');
}

function toggleLog() {
    document.getElementById('logList').classList.toggle('open');
}

// ─── PERSIST ──────────────────────────────────────────────
function saveState() {
    localStorage.setItem('timebox_state', JSON.stringify({
        running: state.running,
        remaining: state.remaining,
        blockIdx: state.blockIdx,
        round: state.round,
        task: state.task,
        dayKey: todayKey(),
    }));
}

// ─── FOCUS ON INPUT ──────────────────────────────────────
document.addEventListener('keydown', function(e) {
    if (e.key === ' ' && e.target.tagName !== 'INPUT') {
        e.preventDefault();
        toggleTimer();
    }
    if (e.key === 'Enter' && e.target.id === 'taskInput') {
        punchIn();
    }
});

// ─── TAB VISIBILITY (drift warning) ──────────────────────
document.addEventListener('visibilitychange', function() {
    if (document.hidden && state.running && state.round > 0) {
        // Reload state when coming back
    } else if (!document.hidden) {
        // Re-sync block when coming back
        var currentB = currentBlock();
        if (Math.abs(currentB - state.blockIdx) > 1) {
            state.blockIdx = currentB;
            state.total = 600;
            state.remaining = 600;
            saveState();
        }
    }
});

// ─── GO ──────────────────────────────────────────────────
init();
</script>
</body>
</html>
